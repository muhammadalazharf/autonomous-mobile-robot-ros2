# =====================================================================
# AMR Mobile Robot Ackermann - RTAB-Map LOCALIZATION mode
# =====================================================================
# Mode ini dipakai SAAT DEMO autonomous navigation dengan map existing.
# Database .db yang dihasilkan dari mapping mode di-load read-only.
# RTAB-Map akan track robot di peta tanpa menambahkan node baru.
# =====================================================================

# FIX: section name harus match node name 'rtabmap' di launch file
rtabmap:
  ros__parameters:

    frame_id: base_link
    map_frame_id: map
    odom_frame_id: odom

    subscribe_depth: false
    subscribe_rgbd:  true
    subscribe_scan:  true
    approx_sync: true
    approx_sync_max_interval: 0.05
    queue_size: 30
    sync_queue_size: 30
    topic_queue_size: 30
    qos: 1                             # SensorDataQoS (BestEffort) — wajib untuk /scan dari rplidar

    tf_delay: 0.05
    tf_tolerance: 0.1
    publish_tf: true

    database_path: ~/.ros/rtabmap.db
    Mem/IncrementalMemory: "false"       # KEY DIFFERENCE: localization mode
    Mem/InitWMWithAllNodes: "true"       # load semua node dari DB
    # FIX 19-Jun: samakan STMSize dengan mapping (10) agar working memory
    # window konsisten saat scoring loop closure candidate.
    Mem/STMSize: "10"

    # FIX: konsisten dengan rtabmap_mapping.yaml (Vis+ICP, bukan ICP-only)
    # ICP-only sulit relocalize karena tidak pakai visual features dari DB.
    Reg/Strategy: "2"
    Reg/Force3DoF: "true"
    Icp/PointToPlane: "true"
    Icp/VoxelSize: "0.05"
    Icp/MaxCorrespondenceDistance: "0.1"

    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1000"
    # FIX 19-Jun: 10 → 8 supaya MATCH dengan ambang yang dipakai SAAT MAPPING.
    # Map dibangun dengan MinInliers=8; relokalisasi tidak boleh lebih ketat
    # dari ambang baked-in peta — kalau tidak, loop closure selalu reject
    # walau peta sehat (sumber loop-rejection saat lock pertama).
    Vis/MinInliers: "8"

    # FIX 19-Jun: tambahkan Kp/* untuk BoW place recognition (HILANG sebelumnya).
    # Tanpa ini, vocabulary lemah saat scoring node-tersimpan → likelihood rendah.
    Kp/MaxFeatures: "400"
    Kp/DetectorStrategy: "8"               # GFTT/BRIEF, sama dengan Vis/FeatureType

    # Localization khusus: lebih banyak proximity check
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    RGBD/LocalRadius: "5.0"
    RGBD/ProximityMaxGraphDepth: "50"
    RGBD/ProximityPathMaxNeighbors: "10"
    # FIX 19-Jun: aktifkan re-extract features saat verifikasi loop candidate.
    # Tutorial resmi rtabmap_ros: tanpa ini, banyak kandidat dengan likelihood
    # tinggi tetap reject karena gagal verifikasi geometris.
    RGBD/LoopClosureReextractFeatures: "true"
    # FIX 19-Jun: longgar dari default 3.0 → 5.0, terima koreksi pose lebih besar
    # saat lock pertama (sering pose initial guess jauh dari true pose).
    RGBD/OptimizeMaxError: "5.0"

    # FIX 19-Jun: 0.11 → 0.05 supaya MATCH dengan ambang mapping.
    # 0.11 = butuh keyakinan 2× lebih tinggi → wajar selalu reject.
    Rtabmap/LoopThr: "0.05"
    # FIX 19-Jun: 1.0 → 2.0 Hz supaya MATCH dengan mapping.
    # Lebih sering cek = lebih banyak peluang lock saat robot lewat titik kunci.
    Rtabmap/DetectionRate: "2.0"

    publish_cloud_obstacles: true
    publish_cloud_ground: true
    publish_grid_map: true

    # FIX: aktifkan gravity constraint juga di localization
    # (sebelumnya 0 — tidak konsisten dengan mapping)
    Optimizer/GravitySigma: "0.3"


rgbd_sync:
  ros__parameters:
    # FIX: RealSense hardware-synced — approx_sync harus false
    # (sebelumnya true, kontradiksi dgn ROS Wiki recommendation)
    approx_sync: false
    approx_sync_max_interval: 0.03
    queue_size: 30
    depth_scale: 1.0
